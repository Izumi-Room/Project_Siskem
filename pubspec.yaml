name: absensi_triple_des_offline
description: "Aplikasi Absensi Triple DES - Sistem Absensi Digital berbasis Flutter + Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # QR Code scanning and generation
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # Firebase Cloud
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_database: ^12.1.1

  # UI & Icons
  cupertino_icons: ^1.0.6
  geolocator: ^14.0.2
  intl: ^0.20.2

  # Lottie Animation
  lottie: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
